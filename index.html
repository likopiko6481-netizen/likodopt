<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Likodopt — Голосовая чат-рулетка</title>
    <script src="https://unpkg.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: url('/bg.png') no-repeat center center fixed,
                        url('/bg.jpg') no-repeat center center fixed,
                        linear-gradient(135deg, #2d1b36 0%, #5c3a6b 50%, #1a1221 100%);
            background-size: cover;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .app {
            background: rgba(24, 27, 34, 0.82);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 460px;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #ff6ec7; letter-spacing: 1px; }
        .online-badge {
            background: rgba(35, 40, 52, 0.85); padding: 6px 12px; border-radius: 20px;
            font-size: 0.85rem; color: #e0d0e8; display: flex; align-items: center;
        }
        .online-dot {
            display: inline-block; width: 8px; height: 8px; background: #00e676;
            border-radius: 50%; margin-right: 6px;
        }
        .voice-box {
            background: rgba(18, 20, 26, 0.72); border-radius: 16px; padding: 25px 15px;
            text-align: center; margin-bottom: 15px; border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .avatar {
            width: 72px; height: 72px; border-radius: 50%; background: #2b2334;
            margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 2rem;
        }
        .avatar.speaking { box-shadow: 0 0 0 6px rgba(255, 110, 199, 0.45); background: #4a2342; }
        #status { font-size: 1rem; color: #f0e6f5; font-weight: 500; }
        .chat-box {
            background: rgba(18, 20, 26, 0.72); border-radius: 14px; height: 180px; display: flex;
            flex-direction: column; margin-bottom: 15px; border: 1px solid rgba(255, 255, 255, 0.08); overflow: hidden;
        }
        #messages { flex: 1; padding: 12px; overflow-y: auto; font-size: 0.9rem; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 10px; max-width: 82%; word-wrap: break-word; }
        .msg.me { background: #ff6ec7; color: #000; align-self: flex-end; font-weight: 600; }
        .msg.partner { background: #2c2538; color: #fff; align-self: flex-start; }
        .msg.sys { background: transparent; color: #a89ab0; align-self: center; font-size: 0.8rem; text-align: center; }
        .chat-input { display: flex; border-top: 1px solid rgba(255, 255, 255, 0.08); }
        .chat-input input { flex: 1; background: transparent; border: none; padding: 12px; color: #fff; outline: none; font-size: 0.9rem; }
        .chat-input button { background: transparent; border: none; color: #ff6ec7; font-weight: bold; padding: 0 16px; cursor: pointer; }
        .chat-input button:disabled { color: #555; cursor: not-allowed; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #btnNext { background: #ff6ec7; color: #000; }
        #btnStop { background: #ff5252; color: #fff; }
        #btnMute { grid-column: span 2; background: #2c2538; color: #fff; font-weight: 600; }
        #btnMute.muted { background: #ff9800; color: #000; }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="logo">LIKODOPT</div>
        <div class="online-badge"><span class="online-dot"></span>P2P Сеть</div>
    </div>

    <div class="voice-box">
        <div class="avatar" id="partnerAvatar">🎙️</div>
        <div id="status">Нажмите «Найти / Далее»</div>
    </div>

    <div class="chat-box">
        <div id="messages"></div>
        <form class="chat-input" id="chatForm">
            <input type="text" id="msgInput" placeholder="Написать сообщение..." disabled autocomplete="off">
            <button type="submit" id="btnSend" disabled>➤</button>
        </form>
    </div>

    <div class="controls">
        <button class="btn" id="btnNext">Найти / Далее</button>
        <button class="btn" id="btnStop" disabled>Стоп</button>
        <button class="btn" id="btnMute" disabled>Выключить микрофон</button>
    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>
</div>

<script>
    const statusEl = document.getElementById('status');
    const partnerAvatar = document.getElementById('partnerAvatar');
    const messagesEl = document.getElementById('messages');
    const chatForm = document.getElementById('chatForm');
    const msgInput = document.getElementById('msgInput');
    const btnSend = document.getElementById('btnSend');
    const btnNext = document.getElementById('btnNext');
    const btnStop = document.getElementById('btnStop');
    const btnMute = document.getElementById('btnMute');
    const remoteAudio = document.getElementById('remoteAudio');

    // 10 общих слотов комнат для случайного подбора без собственного сервера
    const ROOM_SLOTS = 10;
    let peer = null;
    let currentCall = null;
    let dataConn = null;
    let localStream = null;
    let isMuted = false;
    let isSearching = false;

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = 'msg ' + type;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setChatEnabled(enabled) {
        msgInput.disabled = !enabled;
        btnSend.disabled = !enabled;
        if (!enabled) msgInput.value = '';
    }

    async function initAudio() {
        if (!localStream) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                btnMute.disabled = false;
            } catch (err) {
                statusEl.textContent = 'Разрешите доступ к микрофону!';
                throw err;
            }
        }
    }

    function cleanupConnection() {
        isSearching = false;
        partnerAvatar.classList.remove('speaking');
        setChatEnabled(false);
        if (currentCall) { currentCall.close(); currentCall = null; }
        if (dataConn) { dataConn.close(); dataConn = null; }
        if (peer) { peer.destroy(); peer = null; }
        remoteAudio.srcObject = null;
    }

    function setupCallEvents(call) {
        currentCall = call;
        call.on('stream', (remoteStream) => {
            isSearching = false;
            statusEl.textContent = 'Собеседник на связи!';
            messagesEl.innerHTML = '';
            addMessage('Соединение установлено. Поздоровайтесь!', 'sys');
            remoteAudio.srcObject = remoteStream;
            remoteAudio.play().catch(() => {});
            partnerAvatar.classList.add('speaking');
        });
        call.on('close', () => {
            cleanupConnection();
            statusEl.textContent = 'Собеседник отключился';
            addMessage('Собеседник покинул чат. Нажмите «Далее»', 'sys');
        });
    }

    function setupDataEvents(conn) {
        dataConn = conn;
        conn.on('open', () => setChatEnabled(true));
        conn.on('data', (data) => {
            if (typeof data === 'string') addMessage(data, 'partner');
        });
        conn.on('close', () => setChatEnabled(false));
    }

    function startSearch() {
        cleanupConnection();
        isSearching = true;
        btnStop.disabled = false;
        messagesEl.innerHTML = '';
        statusEl.textContent = 'Поиск свободного собеседника...';
        addMessage('Подключение к P2P-сети...', 'sys');

        // Выбираем случайный слот ожидания
        const slot = Math.floor(Math.random() * ROOM_SLOTS);
        const hostId = 'likodopt-room-slot-' + slot;

        // Пробуем занять слот как ожидающий (хост)
        const tempPeer = new Peer(hostId);

        tempPeer.on('open', () => {
            // Слот свободен — мы встали в очередь и ждем звонка
            peer = tempPeer;
            statusEl.textContent = 'Ожидание собеседника...';
            addMessage('Вы в очереди. Ждем второго участника...', 'sys');

            peer.on('call', (incomingCall) => {
                if (!isSearching) { incomingCall.close(); return; }
                incomingCall.answer(localStream);
                setupCallEvents(incomingCall);
            });

            peer.on('connection', (incomingConn) => {
                setupDataEvents(incomingConn);
            });
        });

        tempPeer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                // Слот занят другим человеком! Звоним ему напрямую
                tempPeer.destroy();
                peer = new Peer();
                peer.on('open', () => {
                    const call = peer.call(hostId, localStream);
                    const conn = peer.connect(hostId);
                    setupCallEvents(call);
                    setupDataEvents(conn);
                });
                peer.on('error', () => {
                    if (isSearching) setTimeout(startSearch, 1000);
                });
            } else {
statusEl.textContent = 'Ошибка P2P: ' + err.type;
}
});
}
btnNext.addEventListener('click', async () => {
await initAudio();
startSearch();
});
btnStop.addEventListener('click', () => {
cleanupConnection();
btnStop.disabled = true;
statusEl.textContent = 'Поиск остановлен';
addMessage('Вы завершили диалог', 'sys');
});
btnMute.addEventListener('click', () => {
if (!localStream) return;
isMuted = !isMuted;
localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
btnMute.textContent = isMuted ? 'Включить микрофон' : 'Выключить микрофон';
btnMute.classList.toggle('muted', isMuted);
});
chatForm.addEventListener('submit', (e) => {
e.preventDefault();
const text = msgInput.value.trim();
if (!text || !dataConn || !dataConn.open) return;
addMessage(text, 'me');
dataConn.send(text);
msgInput.value = '';
});
