<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Likodopt — Голосовая чат-рулетка</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: url('/bg.png') no-repeat center center fixed,
                        url('/bg.jpg') no-repeat center center fixed,
                        linear-gradient(135deg, #2d1b36 0%, #5c3a6b 50%, #1a1221 100%);
            background-size: cover;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .app {
            background: rgba(24, 27, 34, 0.85);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 460px;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #ff6ec7; letter-spacing: 1px; }
        .online-badge {
            background: rgba(35, 40, 52, 0.85); padding: 6px 12px; border-radius: 20px;
            font-size: 0.85rem; color: #e0d0e8; display: flex; align-items: center;
        }
        .online-dot {
            display: inline-block; width: 8px; height: 8px; background: #ff5252;
            border-radius: 50%; margin-right: 6px;
        }
        .online-dot.connected { background: #00e676; }
        .voice-box {
            background: rgba(18, 20, 26, 0.72); border-radius: 16px; padding: 25px 15px;
            text-align: center; margin-bottom: 15px; border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .avatar {
            width: 72px; height: 72px; border-radius: 50%; background: #2b2334;
            margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 2rem;
            transition: box-shadow 0.15s ease;
        }
        .avatar.speaking { box-shadow: 0 0 0 6px rgba(255, 110, 199, 0.45); background: #4a2342; }
        #status { font-size: 1rem; color: #f0e6f5; font-weight: 500; }
        .chat-box {
            background: rgba(18, 20, 26, 0.72); border-radius: 14px; height: 180px; display: flex;
            flex-direction: column; margin-bottom: 15px; border: 1px solid rgba(255, 255, 255, 0.08); overflow: hidden;
        }
        #messages { flex: 1; padding: 12px; overflow-y: auto; font-size: 0.9rem; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 10px; max-width: 82%; word-wrap: break-word; }
        .msg.me { background: #ff6ec7; color: #000; align-self: flex-end; font-weight: 600; }
        .msg.partner { background: #2c2538; color: #fff; align-self: flex-start; }
        .msg.sys { background: transparent; color: #a89ab0; align-self: center; font-size: 0.8rem; text-align: center; }
        .chat-input { display: flex; border-top: 1px solid rgba(255, 255, 255, 0.08); }
        .chat-input input { flex: 1; background: transparent; border: none; padding: 12px; color: #fff; outline: none; font-size: 0.9rem; }
        .chat-input button { background: transparent; border: none; color: #ff6ec7; font-weight: bold; padding: 0 16px; cursor: pointer; }
        .chat-input button:disabled { color: #555; cursor: not-allowed; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #btnNext { background: #ff6ec7; color: #000; }
        #btnStop { background: #ff5252; color: #fff; }
        #btnMute { grid-column: span 2; background: #2c2538; color: #fff; font-weight: 600; }
        #btnMute.muted { background: #ff9800; color: #000; }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="logo">LIKODOPT</div>
        <div class="online-badge"><span class="online-dot" id="connDot"></span>Онлайн: <span id="onlineCount">0</span></div>
    </div>

    <div class="voice-box">
        <div class="avatar" id="partnerAvatar">🎙️</div>
        <div id="status">Загрузка скрипта...</div>
    </div>

    <div class="chat-box">
        <div id="messages"></div>
        <form class="chat-input" id="chatForm">
            <input type="text" id="msgInput" placeholder="Написать сообщение..." disabled autocomplete="off">
            <button type="submit" id="btnSend" disabled>➤</button>
        </form>
    </div>

    <div class="controls">
        <button class="btn" id="btnNext">Найти / Далее</button>
        <button class="btn" id="btnStop" disabled>Стоп</button>
        <button class="btn" id="btnMute" disabled>Выключить микрофон</button>
    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>
</div>

<script src="/app.js"></script>
</body>
</html>
