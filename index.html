<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Likodopt — Голосовая чат-рулетка</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: url('/bg.png') no-repeat center center fixed,
                        url('/bg.jpg') no-repeat center center fixed,
                        linear-gradient(135deg, #2d1b36 0%, #5c3a6b 50%, #1a1221 100%);
            background-size: cover;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .app {
            background: rgba(24, 27, 34, 0.85);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 460px;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #ff6ec7; letter-spacing: 1px; }
        .online-badge {
            background: rgba(35, 40, 52, 0.85); padding: 6px 12px; border-radius: 20px;
            font-size: 0.85rem; color: #e0d0e8; display: flex; align-items: center;
        }
        .online-dot {
            display: inline-block; width: 8px; height: 8px; background: #ff5252;
            border-radius: 50%; margin-right: 6px;
        }
        .online-dot.connected { background: #00e676; }
        .voice-box {
            background: rgba(18, 20, 26, 0.72); border-radius: 16px; padding: 25px 15px;
            text-align: center; margin-bottom: 15px; border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .avatar {
            width: 72px; height: 72px; border-radius: 50%; background: #2b2334;
            margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 2rem;
            transition: box-shadow 0.15s ease;
        }
        .avatar.speaking { box-shadow: 0 0 0 6px rgba(255, 110, 199, 0.45); background: #4a2342; }
        #status { font-size: 1rem; color: #f0e6f5; font-weight: 500; }
        .chat-box {
            background: rgba(18, 20, 26, 0.72); border-radius: 14px; height: 180px; display: flex;
            flex-direction: column; margin-bottom: 15px; border: 1px solid rgba(255, 255, 255, 0.08); overflow: hidden;
        }
        #messages { flex: 1; padding: 12px; overflow-y: auto; font-size: 0.9rem; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 10px; max-width: 82%; word-wrap: break-word; }
        .msg.me { background: #ff6ec7; color: #000; align-self: flex-end; font-weight: 600; }
        .msg.partner { background: #2c2538; color: #fff; align-self: flex-start; }
        .msg.sys { background: transparent; color: #a89ab0; align-self: center; font-size: 0.8rem; text-align: center; }
        .chat-input { display: flex; border-top: 1px solid rgba(255, 255, 255, 0.08); }
        .chat-input input { flex: 1; background: transparent; border: none; padding: 12px; color: #fff; outline: none; font-size: 0.9rem; }
        .chat-input button { background: transparent; border: none; color: #ff6ec7; font-weight: bold; padding: 0 16px; cursor: pointer; }
        .chat-input button:disabled { color: #555; cursor: not-allowed; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #btnNext { background: #ff6ec7; color: #000; }
        #btnStop { background: #ff5252; color: #fff; }
        #btnMute { grid-column: span 2; background: #2c2538; color: #fff; font-weight: 600; }
        #btnMute.muted { background: #ff9800; color: #000; }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="logo">LIKODOPT</div>
        <div class="online-badge"><span class="online-dot" id="connDot"></span>Онлайн: <span id="onlineCount">0</span></div>
    </div>

    <div class="voice-box">
        <div class="avatar" id="partnerAvatar">🎙️</div>
        <div id="status">Запуск...</div>
    </div>

    <div class="chat-box">
        <div id="messages"></div>
        <form class="chat-input" id="chatForm">
            <input type="text" id="msgInput" placeholder="Написать сообщение..." disabled autocomplete="off">
            <button type="submit" id="btnSend" disabled>➤</button>
        </form>
    </div>

    <div class="controls">
        <button class="btn" id="btnNext">Найти / Далее</button>
        <button class="btn" id="btnStop" disabled>Стоп</button>
        <button class="btn" id="btnMute" disabled>Выключить микрофон</button>
    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>
</div>

<script>
    const statusEl = document.getElementById('status');
    const onlineCountEl = document.getElementById('onlineCount');
    const connDot = document.getElementById('connDot');
    const partnerAvatar = document.getElementById('partnerAvatar');
    const messagesEl = document.getElementById('messages');
    const chatForm = document.getElementById('chatForm');
    const msgInput = document.getElementById('msgInput');
    const btnSend = document.getElementById('btnSend');
    const btnNext = document.getElementById('btnNext');
    const btnStop = document.getElementById('btnStop');
    const btnMute = document.getElementById('btnMute');
    const remoteAudio = document.getElementById('remoteAudio');

    const myId = 'u_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    let localStream = null;
    let peerConnection = null;
    let isMuted = false;

    const rtcConfig = {
        iceServers: [
            { urls: 'stun:://google.com' },
            { urls: 'stun:://google.com' },
            {
                urls: 'turn:openrelay.metered.ca:80',
                username: 'openrelayproject',
                credential: 'openrelayproject'
            },
            {
                urls: 'turn:openrelay.metered.ca:443',
                username: 'openrelayproject',
                credential: 'openrelayproject'
            }
        ]
    };

    async function apiGet(path, params = {}) {
        const query = new URLSearchParams({ id: myId, t: Date.now(), ...params }).toString();
        const res = await fetch(path + '?' + query);
        return res.json();
    }

    async function apiPost(path, body = {}) {
        const res = await fetch(path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: myId, ...body })
        });
        return res.json();
    }

    async function pollLoop() {
        try {
            const data = await apiGet('/api/poll');
            if (!connDot.classList.contains('connected')) {
                connDot.classList.add('connected');
                statusEl.textContent = 'Нажмите «Найти / Далее»';
            }
            onlineCountEl.textContent = data.online;
            for (const ev of data.events) {
                await handleEvent(ev);
            }
        } catch (e) {
            connDot.classList.remove('connected');
            statusEl.textContent = 'Сервер просыпается, подождите 20 сек...';
        }
        setTimeout(pollLoop, 1200);
    }

    async function handleEvent(data) {
        if (data.type === 'waiting') {
            statusEl.textContent = 'Поиск собеседника...';
            addMessage('Ожидание свободного собеседника...', 'sys');
        } else if (data.type === 'partner_found') {
            statusEl.textContent = 'Собеседник на связи!';
            messagesEl.innerHTML = '';
            addMessage('Соединение установлено. Поздоровайтесь!', 'sys');
            setChatEnabled(true);
            createPeerConnection();

            if (data.initiator) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                await apiPost('/api/signal', { signal: { type: 'offer', offer } });
            }
        } else if (data.type === 'signal') {
            if (!peerConnection) return;
            const sig = data.signal;
            if (sig.type === 'offer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(sig.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                await apiPost('/api/signal', { signal: { type: 'answer', answer } });
            } else if (sig.type === 'answer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(sig.answer));
            } else if (sig.type === 'candidate') {
                await peerConnection.addIceCandidate(new RTCIceCandidate(sig.candidate));
            }
        } else if (data.type === 'chat_message') {
            addMessage(data.text, 'partner');
        } else if (data.type === 'partner_disconnected') {
            closeCall();
            statusEl.textContent = 'Собеседник отключился';
            addMessage('Собеседник покинул чат. Нажмите «Далее»', 'sys');
        }
    }

    statusEl.textContent = 'Подключение к серверу...';
    pollLoop();

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = 'msg ' + type;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

function setChatEnabled(enabled) {
msgInput.disabled = !enabled;
btnSend.disabled = !enabled;
if (!enabled) msgInput.value = '';
}
async function initAudio() {
if (!localStream) {
try {
localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
btnMute.disabled = false;
} catch (err) {
statusEl.textContent = 'Разрешите доступ к микрофону в браузере!';
throw err;
}
}
}
function createPeerConnection() {
peerConnection = new RTCPeerConnection(rtcConfig);
localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
peerConnection.ontrack = (event) => {
const remoteStream = new MediaStream();
remoteStream.addTrack(event.track);
remoteAudio.srcObject = remoteStream;
remoteAudio.play().catch(() => {});
partnerAvatar.classList.add('speaking');
};
peerConnection.onicecandidate = (event) => {
if (event.candidate) {
apiPost('/api/signal', { signal: { type: 'candidate', candidate: event.candidate } });
}
};
}
function closeCall() {
partnerAvatar.classList.remove('speaking');
if (peerConnection) {
peerConnection.close();
peerConnection = null;
}
remoteAudio.srcObject = null;
setChatEnabled(false);
}
btnNext.addEventListener('click', async () => {
await initAudio();
closeCall();
messagesEl.innerHTML = '';
btnStop.disabled = false;
statusEl.textContent = 'Ищем собеседника...';
await apiGet('/api/find');
});
btnStop.addEventListener('click', async () => {
closeCall();
await apiGet('/api/stop');
btnStop.disabled = true;
statusEl.textContent = 'Поиск остановлен';
addMessage('Вы завершили диалог', 'sys');
});
btnMute.addEventListener('click', () => {
if (!localStream) return;
isMuted = !isMuted;
localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
btnMute.textContent = isMuted ? 'Включить микрофон' : 'Выключить микрофон';
btnMute.classList.toggle('muted', isMuted);
});
chatForm.addEventListener('submit', async (e) => {
e.preventDefault();
const text = msgInput.value.trim();
if (!text) return;
addMessage(text, 'me');
msgInput.value = '';
await apiGet('/api/chat', { text });
});
